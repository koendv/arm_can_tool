name: hbpp
version: "2.1"
description: >
  Minimal one-pass C source preprocessor. Shapes UTF-8 string literals
  using HarfBuzz and emits a C header with pre-shaped glyph arrays,
  an integer index table, and baked MUI form string macros for use
  with u8g2_DrawHB().

invocation:
  command: python3 hbpp.py [-v] FONT.ttf SIZE INPUT.c OUTPUT.h
  arguments:
    - name: FONT.ttf
      required: true
      description: Font file (.ttf or .otf), relative to cwd.
    - name: SIZE
      required: true
      type: integer
      description: Render size in pixels.
    - name: INPUT.c
      required: true
      description: C source file to scan (read-only).
    - name: OUTPUT.h
      required: true
      description: C header file to generate.
  options:
    - flag: -v / --verbose
      description: Print font info and per-string results to stderr.

dependencies:
  - name: python
    version: ">=3.8"
  - name: uharfbuzz
    install: pip install uharfbuzz
  build_time_only: true

input:
  encoding: UTF-8
  common_constraints:
    - one match per regex search per line
    - no multiline string literals
    - no escaped quotes in string literals
    - NAME composed of letters, digits, underscores

  patterns:
    HB_STR:
      syntax: 'HB_STR_<n>("utf-8 string")'
      parameters:
        string:
          consumed_by: hbpp
          description: >
            UTF-8 string to shape. Not in macro expansion.
            Retained for readability and cpp syntactic validity.
      uniqueness: NAME must not appear twice in HB_STR pattern
      shared_name: >
        NAME may also appear in MUI_XYHB pattern; both share one array
        and one index.
      generates: '#define HB_STR_<n>(z)  <index>'

    MUI_XYHB:
      syntax: 'MUI_XYHB_<n>(id, x, y, "utf-8 string")'
      parameters:
        id:
          type: string literal
          consumed_by: hbpp
          note: always "HB" in practice; baked into expansion
        x:
          type: integer literal
          range: 0-255
          consumed_by: hbpp; baked into expansion
        y:
          type: integer literal
          range: 0-255
          consumed_by: hbpp; baked into expansion
        string:
          consumed_by: hbpp
          description: UTF-8 string to shape. Not in macro expansion.
      uniqueness: >
        Each (NAME, x, y) combination must be unique.
        Same NAME with different (x, y) is allowed — generates multiple
        MUI_XYHB macros sharing one array.
      shared_name: >
        NAME may also appear in HB_STR pattern; both share one array
        and one index.
      generates: '#define MUI_XYHB_<n>(id, x, y, s)  "A" "HB" "\xXX" "\xYY" "\xII"'
      rationale: >
        MUI_XYA(id, x, y, a) expands to "A" id MUI_##x MUI_##y MUI_##a.
        MUI_## pastes before macro expansion, so a macro-valued a argument
        fails at compile time. MUI_XYHB bypasses this by emitting the
        equivalent byte string directly, with no MUI macro machinery
        involved at compile time.

processing:
  mode: one-pass, line by line
  font: one font per invocation, loaded from CLI argument
  font_units: >
    HarfBuzz font scale set to (upem, upem). Advances and offsets
    converted to pixels via round(value * size_px / upem).
  pen_logic: >
    Replicates hbshape2u8g2.c exactly: cl_x/cl_y reset per cluster,
    cl_offset increments within cluster, pen delta relative to
    previous pen position.
  array_emission: >
    Array emitted on first encounter of a NAME (either pattern).
    Subsequent encounters of the same NAME reuse the stored index.
  rtl_support: >
    Transparent. HarfBuzz produces correct glyph order and advances
    for RTL scripts. u8g2_DrawHB() replays without direction awareness.

output:
  encoding: UTF-8
  header_guard: <stem>.upper().replace('-','_') + '_H'
  includes:
    - stdint.h

  file_header_comment:
    - "Generated by hbpp.py — do not edit manually"
    - "Source: basename of INPUT.c"
    - "Command: sys.argv joined by spaces"

  per_name:
    glyph_comment:
      format: '// <char> <char> ...'
      note: non-printable codepoints shown as U+XXXX
    array:
      name: '_hb_<n>_data'
      type: 'const uint8_t[]'
      qualifier: U8X8_PROGMEM
      entry: '<enc_hi> <enc_lo> <delta_x:int8_t> <delta_y:int8_t>'
      terminator: '0x00 0x00'

  string_table:
    name: '<stem>_strings[]'
    type: 'const uint8_t *[]'
    order: insertion order (first appearance in source, either pattern)
    note: >
      Name derived from output filename stem to avoid collision when
      multiple headers are included.

  defines:
    HB_STR:
      format: '#define HB_STR_<n>(z)  <index>'
      generated_if: HB_STR_NAME present in source
    MUI_XYHB:
      format: '#define MUI_XYHB_<n>(id, x, y, s)  "A" "HB" "\xXX" "\xYY" "\xII"'
      generated_if: MUI_XYHB_NAME present in source
      one_per: each (NAME, x, y) occurrence in source
      expansion_bytes:
        - '"A"'    # MUI XYA command byte
        - '"HB"'   # muif id, 2 chars
        - '"\xXX"' # x coordinate
        - '"\xYY"' # y coordinate
        - '"\xII"' # integer index into string table

  callback_hint:
    format: block comment at end of header
    content: |
      MUIF_RO("HB", mui_draw_hb)

      uint8_t mui_draw_hb(mui_t *ui, uint8_t msg) {
          if (msg == MUIF_MSG_DRAW)
              u8g2_DrawHB(mui_get_u8g2(ui), ui->x, ui->y,
                          <stem>_strings[ui->arg]);
          return 0;
      }
    note: Not generated as code — left to user.

mui_integration:
  muif_entry: 'MUIF_RO("HB", mui_draw_hb)'
  fds_usage: 'MUI_XYHB_NAME("HB", x, y, "utf-8 string")'
  arg_semantics: integer index into <stem>_strings[]
  arg_type: uint8_t (0-255)
  font_mode_required: u8g2_SetFontMode(&u8g2, 1)

error_handling:
  - condition: duplicate NAME in same pattern
    severity: error
    behaviour: reported; output not written
  - condition: font file not found
    severity: fatal
    behaviour: immediate exit
  - condition: uharfbuzz not installed
    severity: fatal
    behaviour: immediate exit with install hint
  - condition: x, y, or index outside 0-255
    severity: warning
    behaviour: reported to stderr; output written
  - condition: delta outside int8_t range (±127)
    severity: warning
    behaviour: reported to stderr; output written
  - condition: no macros found
    severity: warning
    behaviour: reported to stderr; empty-ish header written

limitations:
  - Single line string literals only.
  - No escaped quotes in string literals.
  - One font per invocation.
  - Maximum 256 strings (ui->arg is uint8_t).
  - x and y in MUI_XYHB must be integer literals 0-255.
  - int8_t delta: glyph step limited to ±127 px.
    Not reached at embedded display sizes (<=128 px).
